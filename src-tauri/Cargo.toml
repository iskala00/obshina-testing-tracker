[package]
name = "testing-tracker"
version = "0.1.0"
description = "Регресс-тестирование мобильного приложения Общины"
edition = "2024"

[lib]
name = "testing_tracker_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-http = { version = "2.8", default-features = false, features = ["native-tls", "http2", "system-proxy"] }
window-vibrancy = "0.8.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"

[target.'cfg(target_os = "windows")'.dependencies]
tempfile = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
